name: Realtime alerts

# Triggered by an external cron service (cron-job.org) via the
# workflow_dispatch API — GitHub's own scheduled cron proved too
# unreliable for a fixed cadence, so the `schedule:` trigger is gone.
#
# First step is a market-hours gate: when it's not a weekday US session
# (and force_run / test_telegram aren't set), every expensive step is
# skipped, so an off-hours or weekend trigger costs only the ~1-minute
# runner minimum. Intended external cadence: ~15 minutes — the screener
# rules evaluate daily bars and dedupe per day, so a tighter cadence
# only makes queued triggers cancel each other (the full sweep takes
# 10+ minutes). Time-sensitive stochastic rules run in their own fast
# lane (stoch-alerts.yml, ~5-minute cadence) and are skipped here via
# ALERT_SKIP_STOCH.
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force-run: evaluate rules even if the market is closed'
        type: boolean
        default: false
      test_telegram:
        description: 'Test only: send a Telegram message and exit'
        type: boolean
        default: false

# Don't pile up overlapping runs if one is slow.
concurrency:
  group: realtime-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Market-hours gate
        id: gate
        env:
          FORCE_RUN: ${{ inputs.force_run }}
          TEST_TG: ${{ inputs.test_telegram }}
        run: |
          DOW=$(TZ=America/New_York date +%u)
          HHMM=$((10#$(TZ=America/New_York date +%H%M)))
          PROCEED=false
          if [ "$DOW" -le 5 ] && [ "$HHMM" -ge 930 ] && [ "$HHMM" -le 1600 ]; then
            PROCEED=true
          fi
          if [ "$FORCE_RUN" = "true" ] || [ "$TEST_TG" = "true" ]; then
            PROCEED=true
          fi
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "ET now: $(TZ=America/New_York date '+%a %Y-%m-%d %H:%M')  ->  proceed=$PROCEED"
      - name: Checkout
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v5
      - name: Setup Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt
      - name: Run alert engine
        if: steps.gate.outputs.proceed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_FORCE_RUN: ${{ inputs.force_run }}
          ALERT_TEST_TELEGRAM: ${{ inputs.test_telegram }}
          # Stoch rules run in their own fast lane (stoch-alerts.yml) so
          # they aren't delayed behind the ~10-minute screener sweep.
          ALERT_SKIP_STOCH: "1"
        run: python alerts.py
