name: Snapshot backfill

# Rebuilds daily_snapshot rows for a date the nightly writer missed
# (e.g. the Render web service — which hosts the auto-warm snapshot
# scheduler — was suspended over a close). Fetches from Yahoo on the
# runner and upserts straight into Postgres; idempotent, safe to rerun.
#
# Trigger: manual dispatch with a target date. (A temporary push
# trigger performed the original 2026-07-30/31 repair; the scheduled
# nightly capture lives in snapshot-nightly.yml.)
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Close date(s) to rebuild (YYYY-MM-DD, comma list ok, or "auto")'
        required: true
      tickers:
        description: 'Optional comma-separated subset (default: full universe)'
        required: false
        default: ''

concurrency:
  group: snapshot-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run snapshot backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOT_TARGET_DATE: ${{ inputs.target_date }}
          SNAPSHOT_TICKERS: ${{ inputs.tickers }}
        run: python backfill_snapshot.py
