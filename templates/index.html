<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trading MA — Breakout Screener</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>Trading MA <span class="muted">— Breakout Screener</span></h1>
    <div class="status">
      <span id="status-text">idle</span>
      <button id="run-btn" class="primary">Run screen</button>
    </div>
  </header>

  <section class="filters">
    <div class="filter-group scope">
      <label class="group-label">List</label>
      <div class="filter">
        <select id="list_filter">
          <option value="">Any (S&amp;P 500 + Dow + Nasdaq + TSX)</option>
          <option value="sp500">S&amp;P 500</option>
          <option value="dow">Dow 30</option>
          <option value="nasdaq">Nasdaq</option>
          <option value="tsx">TSX (Canada)</option>
        </select>
      </div>
    </div>

    <div class="filter-group scope">
      <label class="group-label">As-of close</label>
      <div class="filter">
        <select id="as_of_offset">
          <option value="0">Latest</option>
        </select>
      </div>
    </div>

    <div class="filter-group" data-group="price">
      <label class="group-toggle"><input type="checkbox" id="apply_price" checked /> Price range</label>
      <div class="filter">
        <label>min ($)</label>
        <input id="price_min" type="number" step="0.5" min="0" value="1" />
      </div>
      <div class="filter">
        <label>max ($)</label>
        <input id="price_max" type="number" step="1" min="0" value="1000" />
      </div>
    </div>

    <div class="filter-group" data-group="high">
      <label class="group-toggle"><input type="checkbox" id="apply_high" checked /> N-day high</label>
      <div class="filter">
        <label>Lookback (days)</label>
        <input id="high_lookback" type="number" min="2" max="252" value="30" />
      </div>
    </div>

    <div class="filter-group" data-group="rsi">
      <label class="group-toggle"><input type="checkbox" id="apply_rsi" checked /> RSI(14) band</label>
      <div class="filter">
        <label>min</label>
        <input id="rsi_min" type="number" step="0.1" min="0" max="100" value="45" />
      </div>
      <div class="filter">
        <label>max</label>
        <input id="rsi_max" type="number" step="0.1" min="0" max="100" value="50" />
      </div>
    </div>

    <div class="filter-group" data-group="rsi_dev">
      <label class="group-toggle"><input type="checkbox" id="apply_rsi_dev" checked /> RSI(14) dev vs 9d SMA</label>
      <div class="filter">
        <label>min (%)</label>
        <input id="rsi_dev_min_pct" type="number" step="0.5" value="-5" />
      </div>
      <div class="filter">
        <label>max (%)</label>
        <input id="rsi_dev_max_pct" type="number" step="0.5" value="5" />
      </div>
    </div>

    <div class="filter-group" data-group="price_dev">
      <label class="group-toggle"><input type="checkbox" id="apply_price_dev" checked /> Price dev vs EMA(21)</label>
      <div class="filter">
        <label>min (%)</label>
        <input id="price_dev_min_pct" type="number" step="0.5" value="-5" />
      </div>
      <div class="filter">
        <label>max (%)</label>
        <input id="price_dev_max_pct" type="number" step="0.5" value="5" />
      </div>
    </div>

    <div class="filter-group" data-group="rvol">
      <label class="group-toggle"><input type="checkbox" id="apply_rvol" checked /> Relative volume</label>
      <div class="filter">
        <label>lookback (days)</label>
        <input id="rvol_lookback" type="number" min="2" max="60" value="10" />
      </div>
      <div class="filter">
        <label>min (×)</label>
        <input id="rvol_min" type="number" step="0.05" min="0" value="0.5" />
      </div>
    </div>

    <div class="filter-notes">
      Daily bars based on previous close. Source: Yahoo Finance. Uncheck a group to ignore that filter.
    </div>
  </section>

  <main class="content">
    <section class="results">
      <h2>
        Matches <span id="match-count" class="muted"></span>
        <span id="as-of-label" class="as-of-label muted"></span>
      </h2>
      <div class="table-wrap">
        <table id="results-table" class="sortable">
          <thead>
            <tr>
              <th data-sort="ticker" data-type="text">Ticker</th>
              <th data-sort="name" data-type="text">Name</th>
              <th data-sort="exchange" data-type="text">Ex.</th>
              <th class="num" data-sort="close" data-type="num">Prev close</th>
              <th class="num" data-sort="pct_change" data-type="num">% chg</th>
              <th class="num" data-sort="high_lookback" data-type="num" id="th-high">30d high</th>
              <th class="num" data-sort="rsi" data-type="num">RSI(14)</th>
              <th class="num" data-sort="rsi_sma9" data-type="num">9d SMA</th>
              <th class="num" data-sort="rsi_dev_pct" data-type="num">RSI dev</th>
              <th class="num" data-sort="ema21" data-type="num">EMA(21)</th>
              <th class="num" data-sort="price_ema21_dev_pct" data-type="num">vs EMA21</th>
              <th class="num" data-sort="rel_volume" data-type="num">RVol</th>
              <th class="num" data-sort="volume" data-type="num">Volume</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <tr class="empty"><td colspan="13">Click "Run screen" to start.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
