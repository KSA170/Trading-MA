name: Diag deployed rules

# One-shot remote diagnostic for the "tickers scope won't save" report.
# Runs from Actions because the Claude sandbox can't reach the Render
# app. Probes the DEPLOYED service: frontend version markers, current
# stoch-rule scopes, then performs the same update POST the UI sends
# and re-reads. Removed after diagnosis.
on:
  push:
    branches:
      - claude/stock-filter-builder-PrUrK
    paths:
      - '.github/workflows/diag-rules.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe deployed app
        run: |
          B=https://trading-ma.onrender.com
          echo "=== warm-up (Render free tier may be asleep) ==="
          curl -sS -m 90 -o /dev/null -w "root HTTP %{http_code}\n" $B/ || true
          sleep 3
          echo
          echo "=== deployed frontend markers ==="
          HTML=$(curl -sS -m 60 $B/)
          echo "app.js tag: $(echo "$HTML" | grep -o 'app\.js[^"]*' | head -1)"
          echo "index has tickers field: $(echo "$HTML" | grep -c 'cm_rule_scope_tickers')"
          JS=$(curl -sS -m 60 $B/static/app.js)
          echo "app.js has tickers wiring: $(echo "$JS" | grep -c 'cm_rule_scope_tickers')"
          echo "app.js has readScopeValue: $(echo "$JS" | grep -c 'readScopeValue')"
          echo
          echo "=== stoch rules BEFORE ==="
          curl -sS -m 60 $B/api/alerts/rules | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for r in d.get('rules', []):
              if r.get('rule_type') == 'stoch':
                  print(r['id'], repr(r['name']), r['scope_type'], repr(r['scope_value']), 'enabled=', r['enabled'])
          "
          echo
          echo "=== performing the UI's save POST for each stoch rule ==="
          IDS=$(curl -sS -m 60 $B/api/alerts/rules | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(' '.join(str(r['id']) for r in d.get('rules', []) if r.get('rule_type') == 'stoch'))
          ")
          for id in $IDS; do
            echo "--- rule $id: POST scope_type=tickers scope_value='QQQ, BAC' ---"
            curl -sS -m 60 -X POST $B/api/alerts/rules/update \
              -H 'Content-Type: application/json' \
              -d "{\"id\": $id, \"scope_type\": \"tickers\", \"scope_value\": \"QQQ, BAC\"}" \
              -w "\nHTTP %{http_code}\n" | head -c 600
            echo
          done
          echo
          echo "=== stoch rules AFTER ==="
          curl -sS -m 60 $B/api/alerts/rules | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for r in d.get('rules', []):
              if r.get('rule_type') == 'stoch':
                  print(r['id'], repr(r['name']), r['scope_type'], repr(r['scope_value']))
          "
