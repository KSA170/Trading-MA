# Render blueprint for the Trading-MA breakout screener.
# After connecting the repo on render.com, "Apply" this blueprint to create
# the service. https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trading-ma
    runtime: python
    plan: free
    branch: claude/stock-filter-builder-PrUrK
    buildCommand: pip install -r requirements.txt
    # 1 worker keeps the in-memory price/screen caches consistent.
    # 4 threads lets the UI fetch chart data while a screen is running.
    # 180s timeout covers the cold-cache screen run (30-90s typical).
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    autoDeploy: true
    healthCheckPath: /
