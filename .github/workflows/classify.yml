name: Classify universe (sector / industry)

# Rebuilds the ticker -> sector/industry map (ticker_sector table) from
# yfinance industry data. Slow (~30-40 min for the full universe) and a
# bit flaky, but sector/industry classifications change very rarely, so
# running monthly is plenty. Run it manually once after first setting up
# sector alerts; re-running fills any gaps left by yfinance hiccups.
on:
  schedule:
    - cron: '0 8 1 * *'   # 1st of each month, 08:00 UTC
  workflow_dispatch: {}

concurrency:
  group: classify-universe
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build sector/industry map
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python alerts.py classify
